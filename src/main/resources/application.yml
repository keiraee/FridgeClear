spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: FridgeClear

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useUnicode=true&characterEncoding=utf8&useSSL=${DB_USE_SSL:true}&serverTimezone=Asia/Shanghai&connectionTimeZone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

knife4j:
  enable: true
  openapi:
    title: FridgeClear 冰箱清理助手 API
    version: 1.0.0
    description: FridgeClear AI Native 食材消耗与备餐规划助手后端接口

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.flywaydb: INFO

fridgeclear:
  ai:
    encryption-key: ${AI_PROVIDER_ENCRYPTION_KEY:}
  auth:
    jwt-secret: ${AUTH_JWT_SECRET:}
    jwt-expiration-seconds: ${AUTH_JWT_EXPIRATION_SECONDS:7200}
